<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>師長面板 | AI 認知學習應用認證</title>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1a3a2a, #2d6a4f, #40916c);
            min-height: 100vh; color: #333;
        }
        /* ── 頂欄 ── */
        .topbar {
            background: rgba(0,0,0,0.25); backdrop-filter: blur(8px);
            padding: 0 28px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar-brand { color: white; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .topbar-brand span { font-size: 22px; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .user-info { color: rgba(255,255,255,0.85); font-size: 13px; }
        .logout-btn {
            background: rgba(255,255,255,0.15); color: white;
            border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
            padding: 6px 16px; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.25); }

        /* ── 主內容 ── */
        .main { padding: 30px 28px; max-width: 1000px; margin: 0 auto; }
        .page-title { color: white; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .page-sub { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 28px; }

        /* ── 統計卡片 ── */
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
        .stat-card {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
            border-radius: 16px; padding: 22px; text-align: center; color: white;
        }
        .stat-card .num { font-size: 42px; font-weight: 900; }
        .stat-card .num.green { color: #b7e4c7; }
        .stat-card .num.yellow { color: #ffd200; }
        .stat-card .label { font-size: 13px; opacity: 0.75; margin-top: 4px; }

        /* ── 學員表格 ── */
        .table-card {
            background: white; border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .table-header {
            padding: 20px 24px; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .table-header h2 { font-size: 17px; font-weight: 800; color: #1a3a2a; }
        .search-input {
            padding: 8px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px;
            font-size: 13px; outline: none; width: 200px; transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #2d6a4f; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8fdf9; color: #1a3a2a; font-size: 12px;
            font-weight: 700; padding: 12px 16px; text-align: left;
            border-bottom: 2px solid #e8f5e9; letter-spacing: 0.5px;
        }
        td { padding: 14px 16px; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fdf9; }

        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 700;
        }
        .badge-pass { background: #d4edda; color: #155724; }
        .badge-fail { background: #f8d7da; color: #721c24; }
        .badge-none { background: #f0f0f0; color: #888; }

        .score-num { font-size: 18px; font-weight: 800; }
        .score-num.pass { color: #28a745; }
        .score-num.fail { color: #dc3545; }
        .score-num.none { color: #ccc; }

        .empty-msg { text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px; }

        @media (max-width: 600px) {
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .search-input { width: 140px; }
            td, th { padding: 10px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<!-- 頂欄 -->
<div class="topbar">
    <div class="topbar-brand"><span>👨‍🏫</span> 師長管理面板</div>
    <div class="topbar-right">
        <div class="user-info" id="userInfo"></div>
        <button class="logout-btn" onclick="authLogout()">登出</button>
    </div>
</div>

<div class="main">
    <div class="page-title" id="pageTitle">師長面板</div>
    <div class="page-sub">查看您班級的學員學習狀況與認證考試成績</div>

    <!-- 統計 -->
    <div class="stat-grid">
        <div class="stat-card">
            <div class="num" id="totalCount">0</div>
            <div class="label">我的學員人數</div>
        </div>
        <div class="stat-card">
            <div class="num green" id="passCount">0</div>
            <div class="label">已通過認證</div>
        </div>
        <div class="stat-card">
            <div class="num yellow" id="notYetCount">0</div>
            <div class="label">尚未通過</div>
        </div>
    </div>

    <!-- 學員表格 -->
    <div class="table-card">
        <div class="table-header">
            <h2>📋 學員名單</h2>
            <input class="search-input" type="text" id="searchInput" placeholder="搜尋學員…" oninput="renderTable()">
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>帳號</th>
                    <th>姓名</th>
                    <th>考試成績</th>
                    <th>認證狀態</th>
                    <th>考試日期</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-msg" id="emptyMsg" style="display:none">尚無學員資料</div>
    </div>
</div>

<script>
    // 驗證師長身份
    requireTeacher();
    const session = getSession();
    document.getElementById('userInfo').textContent = `師長：${session.displayName}`;
    document.getElementById('pageTitle').textContent = `${session.displayName} 的師長面板`;

    function renderTable() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        let students = getStudentsByTeacher(session.username);
        if (keyword) {
            students = students.filter(s =>
                s.username.toLowerCase().includes(keyword) ||
                s.displayName.toLowerCase().includes(keyword) ||
                (s.studentName || '').toLowerCase().includes(keyword)
            );
        }

        const tbody = document.getElementById('tableBody');
        const empty = document.getElementById('emptyMsg');

        // 更新統計
        const all = getStudentsByTeacher(session.username);
        document.getElementById('totalCount').textContent = all.length;
        document.getElementById('passCount').textContent = all.filter(s => s.pass).length;
        document.getElementById('notYetCount').textContent = all.filter(s => !s.pass).length;

        if (students.length === 0) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        tbody.innerHTML = students.map((s, i) => {
            const scoreClass = s.score === null ? 'none' : (s.pass ? 'pass' : 'fail');
            const scoreText = s.score === null ? '—' : s.score + ' 分';
            let badgeHtml = '';
            if (s.score === null) {
                badgeHtml = '<span class="badge badge-none">尚未考試</span>';
            } else if (s.pass) {
                badgeHtml = '<span class="badge badge-pass">✅ 通過</span>';
            } else {
                badgeHtml = '<span class="badge badge-fail">❌ 未通過</span>';
            }
            return `
                <tr>
                    <td>${i + 1}</td>
                    <td style="font-size:12px;color:#888">${s.username}</td>
                    <td>${s.studentName || s.displayName}</td>
                    <td><span class="score-num ${scoreClass}">${scoreText}</span></td>
                    <td>${badgeHtml}</td>
                    <td style="color:#aaa;font-size:12px">${s.examDate || '—'}</td>
                </tr>
            `;
        }).join('');
    }

    renderTable();
</script>
</body>
</html>
