<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員面板 | AI 認知學習應用認證</title>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f0f4f8; min-height: 100vh;
        }
        .topbar {
            background: linear-gradient(135deg, #0f2027, #2c5364);
            color: white; padding: 14px 28px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar h1 { font-size: 18px; font-weight: 800; }
        .topbar-right { display: flex; gap: 12px; align-items: center; }
        .btn-small {
            padding: 8px 18px; border-radius: 8px; border: none;
            font-size: 13px; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: all 0.2s;
        }
        .btn-course { background: #ffd200; color: #0f2027; }
        .btn-logout { background: rgba(255,255,255,0.15); color: white; }
        .btn-small:hover { transform: translateY(-1px); }

        .container { max-width: 900px; margin: 0 auto; padding: 28px 20px; }
        .section-title {
            font-size: 18px; font-weight: 800; color: #0f2027;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 14px; margin-bottom: 28px;
        }
        .stat-card {
            background: white; border-radius: 14px; padding: 18px 22px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .stat-num { font-size: 34px; font-weight: 900; color: #2c5364; }
        .stat-label { font-size: 13px; color: #888; margin-top: 4px; }

        .card {
            background: white; border-radius: 16px;
            padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }

        /* 新增帳號表單 */
        .add-form {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
        }
        .form-field { flex: 1; min-width: 160px; }
        .form-field label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 5px; }
        .form-field input {
            width: 100%; padding: 10px 13px; border: 1.5px solid #e0e0e0;
            border-radius: 10px; font-size: 14px; outline: none;
            font-family: inherit; transition: border-color 0.2s;
        }
        .form-field input:focus { border-color: #2c5364; }
        .btn-add {
            padding: 10px 22px; background: linear-gradient(135deg, #28a745, #20c997);
            color: white; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
            white-space: nowrap; transition: all 0.2s;
        }
        .btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(40,167,69,0.35); }

        /* 搜尋列 */
        .search-row {
            display: flex; gap: 10px; margin-bottom: 14px; align-items: center;
        }
        .search-input {
            flex: 1; padding: 10px 14px; border: 1.5px solid #e0e0e0;
            border-radius: 10px; font-size: 14px; outline: none; font-family: inherit;
        }
        .search-input:focus { border-color: #2c5364; }
        .filter-btn {
            padding: 9px 16px; border-radius: 10px; border: 1.5px solid #e0e0e0;
            background: white; font-size: 13px; cursor: pointer; font-family: inherit;
            font-weight: 600; color: #555; transition: all 0.2s;
        }
        .filter-btn.active { background: #2c5364; color: white; border-color: #2c5364; }

        /* 帳號列表 */
        .account-table { width: 100%; border-collapse: collapse; }
        .account-table th {
            font-size: 12px; color: #888; font-weight: 700;
            padding: 8px 12px; text-align: left;
            border-bottom: 2px solid #f0f0f0;
        }
        .account-table td {
            padding: 11px 12px; border-bottom: 1px solid #f5f5f5;
            font-size: 14px; color: #333;
        }
        .account-table tr:last-child td { border-bottom: none; }
        .account-table tr:hover td { background: #f8fbfd; }
        .role-badge {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 700;
        }
        .role-admin { background: #fff3cd; color: #856404; }
        .role-student { background: #d4edda; color: #155724; }
        .action-btns { display: flex; gap: 6px; }
        .btn-edit {
            padding: 5px 12px; background: #e3f0ff; color: #1a73e8;
            border: none; border-radius: 7px; font-size: 12px;
            font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .btn-del {
            padding: 5px 12px; background: #fde8e8; color: #e53935;
            border: none; border-radius: 7px; font-size: 12px;
            font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .btn-edit:hover { background: #1a73e8; color: white; }
        .btn-del:hover { background: #e53935; color: white; }

        /* 編輯 Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white; border-radius: 18px; padding: 32px 28px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .modal h3 { font-size: 18px; font-weight: 800; color: #0f2027; margin-bottom: 18px; }
        .modal-field { margin-bottom: 14px; }
        .modal-field label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 5px; }
        .modal-field input {
            width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0;
            border-radius: 10px; font-size: 15px; outline: none; font-family: inherit;
        }
        .modal-field input:focus { border-color: #2c5364; }
        .modal-field .hint { font-size: 11px; color: #aaa; margin-top: 4px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save {
            flex: 1; padding: 12px; background: linear-gradient(135deg, #0f2027, #2c5364);
            color: white; border: none; border-radius: 10px; font-size: 15px;
            font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .btn-cancel {
            flex: 1; padding: 12px; background: #f0f0f0; color: #555;
            border: none; border-radius: 10px; font-size: 15px;
            font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: #2c5364; color: white; padding: 12px 28px;
            border-radius: 30px; font-size: 14px; font-weight: 700;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999;
        }
        .toast.show { opacity: 1; }
        .empty-msg { text-align: center; padding: 24px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
<script>requireAdmin();</script>

<div class="topbar">
    <h1>🛡️ 管理員面板 — AI 認知學習應用認證</h1>
    <div class="topbar-right">
        <button class="btn-small btn-course" onclick="location.href='index.html'">📚 進入課程</button>
        <button class="btn-small btn-logout" onclick="authLogout()">登出</button>
    </div>
</div>

<div class="container">
    <!-- 統計 -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-num" id="totalCount">—</div>
            <div class="stat-label">總帳號數</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="studentCount">—</div>
            <div class="stat-label">學員帳號</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="adminCount">—</div>
            <div class="stat-label">管理員帳號</div>
        </div>
    </div>

    <!-- 新增帳號 -->
    <div class="card">
        <div class="section-title">➕ 新增學員帳號</div>
        <div class="add-form">
            <div class="form-field">
                <label>帳號（Email）</label>
                <input type="text" id="newUsername" placeholder="s211999@ms.cshs.tc.edu.tw">
            </div>
            <div class="form-field">
                <label>密碼</label>
                <input type="text" id="newPassword" placeholder="預設密碼">
            </div>
            <div class="form-field">
                <label>顯示名稱（選填）</label>
                <input type="text" id="newDisplayName" placeholder="留空則使用帳號">
            </div>
            <button class="btn-add" onclick="doAddAccount()">新增</button>
        </div>
    </div>

    <!-- 帳號列表 -->
    <div class="card">
        <div class="section-title">👥 帳號列表</div>
        <div class="search-row">
            <input class="search-input" id="searchInput" placeholder="🔍 搜尋帳號或名稱..." oninput="renderTable()">
            <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">全部</button>
            <button class="filter-btn" id="filterStudent" onclick="setFilter('student')">學員</button>
            <button class="filter-btn" id="filterAdmin" onclick="setFilter('admin')">管理員</button>
        </div>
        <table class="account-table">
            <thead>
                <tr>
                    <th>帳號</th>
                    <th>顯示名稱</th>
                    <th>密碼</th>
                    <th>角色</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="accountTableBody"></tbody>
        </table>
        <div class="empty-msg" id="emptyMsg" style="display:none;">找不到符合的帳號</div>
    </div>
</div>

<!-- 編輯 Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3>✏️ 編輯帳號</h3>
        <div class="modal-field">
            <label>帳號</label>
            <input type="text" id="editUsername" disabled style="background:#f5f5f5; color:#888;">
        </div>
        <div class="modal-field">
            <label>新密碼</label>
            <input type="text" id="editPassword" placeholder="留空則不修改">
            <div class="hint">留空則保持原密碼不變</div>
        </div>
        <div class="modal-field">
            <label>顯示名稱</label>
            <input type="text" id="editDisplayName" placeholder="顯示名稱">
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-save" onclick="doEditAccount()">儲存</button>
        </div>
    </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
let currentFilter = 'all';
let editingUsername = '';

function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = isError ? '#e53935' : '#2c5364';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
}

function updateStats() {
    const accounts = listAccounts();
    document.getElementById('totalCount').textContent = accounts.length;
    document.getElementById('studentCount').textContent = accounts.filter(a => a.role === 'student').length;
    document.getElementById('adminCount').textContent = accounts.filter(a => a.role === 'admin').length;
}

function setFilter(f) {
    currentFilter = f;
    ['all','student','admin'].forEach(id => {
        document.getElementById('filter' + id.charAt(0).toUpperCase() + id.slice(1))
            .classList.toggle('active', id === f);
    });
    renderTable();
}

function renderTable() {
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    let accounts = listAccounts().filter(a => {
        if (currentFilter !== 'all' && a.role !== currentFilter) return false;
        if (keyword) return a.username.toLowerCase().includes(keyword) || a.displayName.toLowerCase().includes(keyword);
        return true;
    });

    const tbody = document.getElementById('accountTableBody');
    const empty = document.getElementById('emptyMsg');

    if (accounts.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = accounts.map(a => `
        <tr>
            <td>${a.username}</td>
            <td>${a.displayName}</td>
            <td><code style="background:#f0f0f0;padding:2px 7px;border-radius:5px;font-size:12px;">${a.password}</code></td>
            <td><span class="role-badge role-${a.role}">${a.role === 'admin' ? '管理員' : '學員'}</span></td>
            <td>
                <div class="action-btns">
                    <button class="btn-edit" onclick="openEdit('${a.username}')">編輯</button>
                    ${a.username !== 'Aa@0981737608' ? `<button class="btn-del" onclick="doDelete('${a.username}')">刪除</button>` : ''}
                </div>
            </td>
        </tr>
    `).join('');
}

function doAddAccount() {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value.trim();
    const displayName = document.getElementById('newDisplayName').value.trim();
    if (!username || !password) { showToast('帳號和密碼不能為空', true); return; }
    const result = addAccount(username, password, displayName || username);
    if (result.ok) {
        showToast(`✅ 已新增帳號：${username}`);
        document.getElementById('newUsername').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('newDisplayName').value = '';
        updateStats(); renderTable();
    } else {
        showToast(result.msg, true);
    }
}

function openEdit(username) {
    editingUsername = username;
    const accounts = getAccounts();
    const a = accounts[username];
    document.getElementById('editUsername').value = username;
    document.getElementById('editPassword').value = '';
    document.getElementById('editDisplayName').value = a.displayName;
    document.getElementById('editModal').classList.add('show');
}

function closeModal() {
    document.getElementById('editModal').classList.remove('show');
    editingUsername = '';
}

function doEditAccount() {
    const newPw = document.getElementById('editPassword').value.trim();
    const newName = document.getElementById('editDisplayName').value.trim();
    const result = editAccount(editingUsername, newPw || null, newName || null);
    if (result.ok) {
        showToast(`✅ 已更新帳號：${editingUsername}`);
        closeModal(); renderTable();
    } else {
        showToast(result.msg, true);
    }
}

function doDelete(username) {
    if (!confirm(`確定要刪除帳號「${username}」嗎？`)) return;
    const result = deleteAccount(username);
    if (result.ok) {
        showToast(`🗑️ 已刪除帳號：${username}`);
        updateStats(); renderTable();
    } else {
        showToast(result.msg, true);
    }
}

// 初始化
updateStats();
renderTable();
</script>
</body>
</html>
